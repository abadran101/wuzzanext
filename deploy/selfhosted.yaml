# Wuzzanext on the home server: the configuration template (task 019).
#
# On the host this file becomes C:\services\wuzzanext\app\config\selfhosted.yaml (see
# docs/deployment-spec.md). Every <...> is filled in on the host, never in this repository.
# Secrets are not written here: the service gets them from its environment
# (DT_JWT_SECRET, DT_TRANSLATION_API_KEY), which overrides the empty values below.
name: "selfhosted"
is_done_tick_dot_com: false
is_user_creation_disabled: false
telegram:
  token: ""
pushover:
  token: ""
database:
  type: "sqlite" # the file is DT_SQLITE_PATH
  migration: true
jwt:
  secret: "" # from DT_JWT_SECRET; the server refuses to start with less than 32 characters
  session_time: 168h # 7 days
  max_refresh: 1440h # 60 days
server:
  host: "<BIND_ADDRESS>" # chosen and checked at deployment (spec, "Bind address")
  port: 2021
  read_timeout: 10s
  # Covers the whole response, so it must outlast the largest download over the home
  # network: the Android app (about 76 MB) and the source archive (about 26 MB).
  write_timeout: 10m
  rate_period: 60s
  rate_limit: 300
  cors_allow_origins:
    - "<PUBLIC_URL>" # the HTTPS address Nginx Proxy Manager serves, e.g. https://<name>
    # the Android app's own origins
    - "https://localhost"
    - "http://localhost"
    - "capacitor://localhost"
  serve_frontend: true
  serve_swagger: false
  public_host: "<PUBLIC_URL>"
  downloads_dir: 'C:\services\wuzzanext\data\downloads' # the owner puts the signed wuzzanext.apk here
logging:
  level: "info"
  encoding: "json"
  development: false
scheduler_jobs:
  due_job: 30m
  overdue_job: 3h
  pre_due_job: 3h
email:
  host:
  port:
  key:
  email:
  user:
  app_host:
  log_raw_url: true # password reset links go to the log; no mail server is set up
storage:
  storage_type: "local"
  base_path: 'C:\services\wuzzanext\data\uploads' # next to the database, inside the nightly backup
  max_file_size: 5242880 # 5 MB per file
  max_user_storage: 1073741824 # 1 GB per person
realtime:
  enabled: true
  sse_enabled: true
  heartbeat_interval: 60s
  connection_timeout: 120s
  max_connections: 1000
  max_connections_per_user: 5
  event_queue_size: 2048
  cleanup_interval: 2m
  stale_threshold: 5m
  enable_compression: true
  enable_stats: true
  allowed_origins: # not read by this server version; live updates follow cors_allow_origins
    - "*"
# Chore names and details in the reader's language (docs/translation-setup.md). Turned on
# with DT_TRANSLATION_ENABLED=true and the key in DT_TRANSLATION_API_KEY.
translation:
  enabled: false
  provider: "google"
  daily_char_limit: 15000
# No cloud push relay (no-cloud rule).
bridge:
  enabled: false
  base_url: ""
  instance_id: ""
  instance_token: ""
  timeout_seconds: 15
