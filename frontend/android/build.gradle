// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.10.1'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    configurations.configureEach {
        // The app does not use Advertising ID. Exclude any transitive
        // ads identifier dependency so Play Console does not require an AD_ID declaration.
        exclude group: 'com.google.android.gms', module: 'play-services-ads-identifier'
    }
}

// Capacitor plugin modules default to Build-Tools 35.0.0, and send-intent
// hardcodes SDK 35; build them with the installed SDK 36 and Build-Tools
// instead of letting Gradle download more. Registered before the modules
// apply the Android plugin, so it runs before the plugin locks its settings.
subprojects {
    afterEvaluate {
        if (plugins.hasPlugin('com.android.library')) {
            android.compileSdk = rootProject.ext.compileSdkVersion
            android.buildToolsVersion = rootProject.ext.buildToolsVersion
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
